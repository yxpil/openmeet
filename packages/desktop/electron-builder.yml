appId: com.openmeet.desktop
productName: OpenMeet
copyright: Copyright © 2026 OpenMeet contributors
directories:
  output: release
files:
  - out/**/*
  - resources/**
  - package.json
asar: true
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: OpenMeet-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OpenMeet
protocols:
  - name: OpenMeet
    schemes:
      - openmeet
